# Production overlay. Requires Docker Compose v2.24+ for !reset.
# Uses the MySQL service already installed on the server. No database container is started.
# Host nginx keeps ports 80 and 443. The Mini App is only on 127.0.0.1:8080.
services:
  mysql:
    profiles: ["bundled-db"]

  api:
    restart: unless-stopped
    network_mode: host
    ports: !reset []
    depends_on: !reset []
    environment:
      # Host port 3000 is already taken by another service.
      PORT: 3010
      HOST: 127.0.0.1
      FETCHER_URL: http://127.0.0.1:3020
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}

  fetcher:
    restart: unless-stopped
    network_mode: host
    environment:
      PORT: 3020
      HOST: 127.0.0.1

  worker:
    restart: unless-stopped
    network_mode: host
    depends_on: !reset []
    environment:
      FETCHER_URL: http://127.0.0.1:3020
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}

  web:
    restart: unless-stopped
    network_mode: host
    ports: !reset []
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
