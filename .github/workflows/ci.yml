name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://koma:koma@127.0.0.1:3306/koma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload and start
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "Missing VPS_HOST, VPS_USER, or VPS_SSH_PRIVATE_KEY"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh_opts="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes"
          ssh $ssh_opts "$SSH_USER@$SSH_HOST" "mkdir -p /usr/src/koma_miniApp/KOMA"
          tar -czf - \
            --exclude .git \
            --exclude node_modules \
            --exclude .env \
            --exclude .mysql-ready \
            --exclude '**/dist' \
            . | ssh $ssh_opts "$SSH_USER@$SSH_HOST" "tar -xzf - -C /usr/src/koma_miniApp/KOMA"
          ssh $ssh_opts "$SSH_USER@$SSH_HOST" "test -f /usr/src/koma_miniApp/KOMA/.env" \
            || { echo "Create /usr/src/koma_miniApp/KOMA/.env on the server. Deploys do not write it."; exit 1; }
          ssh $ssh_opts "$SSH_USER@$SSH_HOST" \
            "cd /usr/src/koma_miniApp/KOMA && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans" \
            || {
              ssh $ssh_opts "$SSH_USER@$SSH_HOST" \
                "cd /usr/src/koma_miniApp/KOMA && docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 120 api"
              exit 1
            }
